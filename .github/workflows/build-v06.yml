name: Build ANJA NAQOOSH MAKER v0.6

on:
  workflow_dispatch:
  push:
    paths:
      - "ANJA_NAQOOSH_MAKER_v0_6_source_DOWNLOAD.zip"
      - ".github/workflows/build-v06.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android source
        run: |
          unzip -o ANJA_NAQOOSH_MAKER_v0_6_source_DOWNLOAD.zip -d /tmp/anja
          cp -a /tmp/anja/ANJA_NAQOOSH_MAKER/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANJA-NAQOOSH-MAKER-v0.6-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
